name: build

on:
  push:
    branches:
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # NetTrans.Core has no WinUI dependency, so its tests run on Linux in
  # seconds — that is the fast feedback loop. The Windows build below is the
  # only thing that can compile the shell.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test NetTrans.Core
        # minimal prints failures and the summary, and nothing for the ~800
        # tests that passed -- which is what anyone reading a red run wants.
        run: dotnet test NetTrans.Core.Tests/NetTrans.Core.Tests.csproj -c Release --logger "console;verbosity=minimal"

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0-windows10.0.19041.0, net10.0-windows10.0.19041.0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NetTrans/NetTrans.csproj -r win-x64

      - name: Build (${{ matrix.tfm }})
        run: dotnet build NetTrans/NetTrans.csproj -c Release -f ${{ matrix.tfm }} -r win-x64 --no-restore

  # A zip anyone can download from the run page and double-click. The project is
  # unpackaged and self-contained, so this carries its own .NET and Windows App
  # SDK -- nothing to install first.
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # net8.0 rather than net10.0: it is the one whose runtime is bundled here,
      # and the two targets are the same source.
      - name: Publish (win-x64)
        run: >
          dotnet publish NetTrans/NetTrans.csproj
          -c Release
          -f net8.0-windows10.0.19041.0
          -r win-x64
          -o publish/NetTrans

      - name: Record what this build is
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          @(
            "NetTrans"
            ""
            "commit: $sha ($env:GITHUB_REF_NAME)"
            "built:  $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC"
            ""
            "双击 NetTrans.exe 运行，绿色版，设置写在同目录的 NetTrans.settings.json。"
            "--demo 参数用手稿的示例数据填充界面，不联网、不写文件。"
            ""
            "自包含：.NET 与 Windows App SDK 都在包里。若提示缺少 VCRUNTIME140，"
            "装一次 Microsoft Visual C++ 2015-2022 Redistributable (x64) 即可。"
          ) | Set-Content -Encoding UTF8 publish/NetTrans/关于这个版本.txt

      # What actually ended up in the box. A missing dependency is invisible
      # until the app dies on someone's machine with no message.
      - name: List what was published
        shell: pwsh
        run: |
          Get-ChildItem publish/NetTrans -File |
            Sort-Object Length -Descending |
            Select-Object -First 40 Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String -Width 200

          "total files: $((Get-ChildItem publish/NetTrans -Recurse -File).Count)"

      # Builds every control on its own first. When the smoke test below fails
      # with XamlParseException against a window, this is the step that says
      # which control inside it threw.
      - name: XAML probe
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Join-Path $PWD 'publish/NetTrans/NetTrans.exe'
          $log = Join-Path $PWD 'publish/NetTrans/NetTrans.startup.log'

          $probe = Start-Process $exe -ArgumentList '--demo','--xamlprobe' -PassThru
          $probe.WaitForExit(60000) | Out-Null

          if (Test-Path $log) {
            Write-Host '--- xaml probe ---'
            Get-Content $log | Where-Object { $_ -match 'ok |FAILED|控件|HRESULT|Exception' } | Write-Host
            Write-Host '--- end ---'
            Remove-Item $log
          }

      # The app has to survive being started. A runner has a desktop, so this
      # is the one check that exercises XAML load, the Win32 frame and the
      # first paint -- everything the unit tests cannot reach.
      - name: Smoke test (--demo)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/NetTrans/NetTrans.exe'
          $log = Join-Path $PWD 'publish/NetTrans/NetTrans.startup.log'

          $app = Start-Process $exe -ArgumentList '--demo' -PassThru
          Start-Sleep -Seconds 20

          if (Test-Path $log) {
            Write-Host '--- NetTrans.startup.log ---'
            Get-Content $log | Write-Host
            Write-Host '--- end ---'
          } else {
            Write-Host 'no startup log was written'
          }

          if ($app.HasExited) {
            throw "NetTrans exited on its own with code $($app.ExitCode) -- it should still be running."
          }

          Stop-Process -Id $app.Id -Force

          if (-not (Test-Path $log)) { throw 'no startup log' }
          if (-not (Select-String -Path $log -SimpleMatch -Pattern '启动完成' -Quiet)) {
            throw 'the app started but never finished starting up -- see the log above.'
          }

          Write-Host 'started, drew a window, and stayed up.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetTrans-win-x64
          path: publish/NetTrans
          retention-days: 30
