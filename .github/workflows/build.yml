name: build

on:
  push:
    branches:
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # NetTrans.Core has no WinUI dependency, so its tests run on Linux in
  # seconds — that is the fast feedback loop. The Windows build below is the
  # only thing that can compile the shell.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Two things the XAML compiler accepts and the XAML parser refuses. Both
      # only show up when a window is built, as a parse failure with no line
      # number, so catching them here costs seconds instead of a Windows run.
      - name: Check XAML
        run: python3 tools/check-xaml.py

      - name: Test NetTrans.Core
        # minimal prints failures and the summary, and nothing for the ~800
        # tests that passed -- which is what anyone reading a red run wants.
        run: dotnet test NetTrans.Core.Tests/NetTrans.Core.Tests.csproj -c Release --logger "console;verbosity=minimal"

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0-windows10.0.19041.0, net10.0-windows10.0.19041.0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NetTrans/NetTrans.csproj -r win-x64

      - name: Build (${{ matrix.tfm }})
        run: dotnet build NetTrans/NetTrans.csproj -c Release -f ${{ matrix.tfm }} -r win-x64 --no-restore

  # A zip anyone can download from the run page and double-click. The project is
  # unpackaged and self-contained, so this carries its own .NET and Windows App
  # SDK -- nothing to install first.
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # net8.0 rather than net10.0: it is the one whose runtime is bundled here,
      # and the two targets are the same source.
      - name: Publish (win-x64)
        run: >
          dotnet publish NetTrans/NetTrans.csproj
          -c Release
          -f net8.0-windows10.0.19041.0
          -r win-x64
          -p:Platform=x64
          -o publish/NetTrans

      - name: Record what this build is
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          @(
            "NetTrans"
            ""
            "commit: $sha ($env:GITHUB_REF_NAME)"
            "built:  $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC"
            ""
            "双击 NetTrans.exe 运行，解压即用的绿色版：设置写在同目录的"
            "NetTrans.settings.json，哈希库写在 NetTrans.hashes.json，没有安装程序、"
            "不写注册表；不要的时候整个文件夹删掉即可。"
            ""
            "--demo 参数用手稿的示例数据填充界面，不联网、不写文件。"
            ""
            "自包含：.NET 与 Windows App SDK 都在包里。若提示缺少 VCRUNTIME140，"
            "装一次 Microsoft Visual C++ 2015-2022 Redistributable (x64) 即可。"
          ) | Set-Content -Encoding UTF8 publish/NetTrans/关于这个版本.txt

      # What actually ended up in the box. A missing dependency is invisible
      # until the app dies on someone's machine with no message.
      - name: List what was published
        shell: pwsh
        run: |
          Get-ChildItem publish/NetTrans -File |
            Sort-Object Length -Descending |
            Select-Object -First 40 Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String -Width 200

          Get-ChildItem publish/NetTrans -Directory |
            Select-Object Name, @{n='MB';e={[math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum/1MB,2)}} |
            Sort-Object MB -Descending |
            Format-Table -AutoSize | Out-String -Width 200

          $total = (Get-ChildItem publish/NetTrans -Recurse -File | Measure-Object Length -Sum)
          "total files: $($total.Count), $([math]::Round($total.Sum/1MB,1)) MB"

      # Builds every control on its own first, sheets included -- they take
      # the shell view model, so the probe passes it the demo one. This is the
      # check that would have caught the icons-as-abstract-Geometry failure,
      # and it is the only one that reaches a sheet nobody has opened yet.
      #
      # Not continue-on-error: a control that cannot be constructed is an app
      # that dies when someone opens that sheet.
      - name: XAML probe
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/NetTrans/NetTrans.exe'
          $log = Join-Path $PWD 'publish/NetTrans/NetTrans.startup.log'

          $probe = Start-Process $exe -ArgumentList '--demo','--xamlprobe' -PassThru
          if (-not $probe.WaitForExit(60000)) { throw '逐个构造没有在 60 秒内结束' }

          if (-not (Test-Path $log)) { throw '逐个构造没有写日志' }

          $lines = Get-Content $log
          $lines | Where-Object { $_ -match 'ok |FAILED|控件|HRESULT|Exception' } | Write-Host

          $summary = $lines | Where-Object { $_ -match '个控件' } | Select-Object -Last 1
          if (-not $summary) { throw '日志里没有逐个构造的结果 —— 这一步其实什么都没查' }
          if ($summary -notmatch '0 个失败') { throw "有控件构造失败：$summary" }

          # The sheets are the half most likely to reference a resource that is
          # not there, so their presence in the list is itself an assertion.
          foreach ($sheet in @('TidySheet', 'BigFileSheet', 'SettingsSheet')) {
            if (-not ($lines | Where-Object { $_ -match "ok .*$sheet" })) { throw "$sheet 没有被构造到" }
          }

          Remove-Item $log

      # The app has to survive being started. A runner has a desktop, so this
      # is the one check that exercises XAML load, the Win32 frame and the
      # first paint -- everything the unit tests cannot reach.
      - name: Smoke test (--demo)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/NetTrans/NetTrans.exe'
          $log = Join-Path $PWD 'publish/NetTrans/NetTrans.startup.log'

          $app = Start-Process $exe -ArgumentList '--demo' -PassThru
          Start-Sleep -Seconds 20

          if (Test-Path $log) {
            Write-Host '--- NetTrans.startup.log ---'
            Get-Content $log | Write-Host
            Write-Host '--- end ---'
          } else {
            Write-Host 'no startup log was written'
          }

          if ($app.HasExited) {
            throw "NetTrans exited on its own with code $($app.ExitCode) -- it should still be running."
          }

          Stop-Process -Id $app.Id -Force

          if (-not (Test-Path $log)) { throw 'no startup log' }
          if (-not (Select-String -Path $log -SimpleMatch -Pattern '启动完成' -Quiet)) {
            throw 'the app started but never finished starting up -- see the log above.'
          }

          Write-Host 'started, drew a window, and stayed up.'

      # 大文件核对 is a command-line mode of the same executable, so this is the
      # one step that runs the shipped binary as a tool rather than as an app:
      # a directory with one file over the threshold, one under it, and one
      # named like a page file. Only the first may come back.
      - name: Big-file audit (--bigfiles)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'bigfile-fixture'
          New-Item -ItemType Directory -Force $dir | Out-Null

          $random = [System.Random]::new(7)
          function New-Payload($name, $size) {
            $bytes = [byte[]]::new($size)
            $random.NextBytes($bytes)
            [System.IO.File]::WriteAllBytes((Join-Path $dir $name), $bytes)
          }

          New-Payload 'archive.iso'  (12MB)
          New-Payload 'small.txt'    (1MB)
          New-Payload 'pagefile.sys' (12MB)

          $exe = Join-Path $PWD 'publish/NetTrans/NetTrans.exe'
          $report = Join-Path $PWD 'bigfile-report.md'

          $tool = Start-Process $exe -ArgumentList '--bigfiles',$dir,'--min-size','8MB','--offline','--no-wait','--report',$report -PassThru -Wait
          "exit code: $($tool.ExitCode)"

          if (-not (Test-Path $report)) { throw '大文件核对没有写出报告' }
          Get-Content $report | Write-Host

          $text = Get-Content $report -Raw
          if ($text -notmatch 'archive\.iso')  { throw '报告里没有 archive.iso —— 超过门槛的文件没被算' }
          if ($text -match 'small\.txt')       { throw '报告里有 small.txt —— 门槛没生效' }
          if ($text -match 'pagefile\.sys')    { throw '报告里有 pagefile.sys —— 系统文件没被排除' }

          $ledger = Join-Path $PWD 'publish/NetTrans/NetTrans.bigfiles.json'
          if (-not (Test-Path $ledger)) { throw '账本没写出来' }

          # Its own file, not 哈希库. If the audit ever starts writing into the
          # download database this is where it gets caught.
          if (Test-Path (Join-Path $PWD 'publish/NetTrans/NetTrans.hashes.json')) {
            throw '大文件核对写进了主程序的哈希库'
          }

          Remove-Item $ledger, (Join-Path $PWD 'publish/NetTrans/NetTrans.bigfiles.md') -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force

          if ($tool.ExitCode -ne 0) { throw "大文件核对退出码 $($tool.ExitCode)，应为 0" }

      # 深度整理 moves people's files, so the check is end to end, and it goes
      # through the draft: build one, apply exactly it, then undo. That is the
      # same path the wizard takes, minus the clicking.
      - name: Tidy through a draft, then undo (--tidy --plan)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'tidy-fixture'
          New-Item -ItemType Directory -Force $dir | Out-Null

          # The first two are one piece of work in two files; the rest are not.
          $names = @('建筑报告.png', '建筑报告v1.0.1.docx', 'invoice.pdf', 'setup.exe', 'movie.mkv.part')
          foreach ($name in $names) {
            $path = Join-Path $dir $name
            Set-Content -Path $path -Value 'x' -Encoding UTF8
            # Older than the settle window, which holds back anything that may
            # still be being written.
            (Get-Item $path).LastWriteTimeUtc = (Get-Date).AddDays(-1).ToUniversalTime()
          }

          $exe  = Join-Path $PWD 'publish/NetTrans/NetTrans.exe'
          $plan = Join-Path $PWD 'tidy-plan.json'

          $draft = Start-Process $exe -ArgumentList '--tidy',$dir,'--plan',$plan,'--no-wait' -PassThru -Wait
          if (-not (Test-Path $plan)) { throw '没有产出草稿' }

          $json = Get-Content $plan -Raw
          if ($json -notmatch '建筑报告') { throw '草稿里没有「建筑报告」这个项目 —— 项目识别没生效' }
          Write-Host $json

          $apply = Start-Process $exe -ArgumentList '--tidy','--plan',$plan,'--apply','--no-wait' -PassThru -Wait
          if ($apply.ExitCode -ne 0) { throw "按草稿执行退出码 $($apply.ExitCode)，应为 0" }

          $expected = @(
            '项目\建筑报告\建筑报告.png'
            '项目\建筑报告\建筑报告v1.0.1.docx'
            '文档\invoice.pdf'
            '安装包\setup.exe'
            'movie.mkv.part'          # 没下完的，原地不动
          )

          foreach ($relative in $expected) {
            if (-not (Test-Path (Join-Path $dir $relative))) { throw "整理后没找到 $relative" }
          }

          $undo = Start-Process $exe -ArgumentList '--tidy','--undo','--no-wait' -PassThru -Wait
          if ($undo.ExitCode -ne 0) { throw "还原退出码 $($undo.ExitCode)，应为 0" }

          foreach ($name in $names) {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "还原后 $name 没有回到原位" }
          }

          $journal = Join-Path $PWD 'publish/NetTrans/NetTrans.tidy.json'
          if (-not (Test-Path $journal)) { throw '整理日志没写出来' }
          if (Test-Path (Join-Path $PWD 'publish/NetTrans/NetTrans.hashes.json')) {
            throw '深度整理写进了主程序的哈希库'
          }

          Remove-Item $journal, $plan, (Join-Path $PWD 'publish/NetTrans/NetTrans.tidy.md') -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force

      # Last, so it is the easy thing to find when the smoke test above failed.
      # A compiled XAML page is found through the app's own PRI index; without
      # it every ms-appx:/// lookup fails and every page throws the same parse
      # error, which is exactly what the probe showed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetTrans-win-x64
          path: publish/NetTrans
          retention-days: 30

      # Dead last on purpose: whatever went wrong, this is the tail of the log.
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $root = 'publish/NetTrans'
          $log  = Join-Path $root 'NetTrans.startup.log'

          "resources.pri : $(Test-Path (Join-Path $root 'resources.pri'))"
          "NetTrans.pri  : $(Test-Path (Join-Path $root 'NetTrans.pri'))"

          if (Test-Path $log) {
            "--- last 12 lines of the startup log ---"
            Get-Content $log -Tail 12 | ForEach-Object { $_ }
          } else {
            "no startup log"
          }

  # Dispatched by hand (Actions → build → Run workflow), never on a push: turns
  # the run's zip into a GitHub Release, which is a link that needs no login and
  # does not expire -- unlike an artifact.
  #
  # It lives in build.yml rather than a release.yml of its own for one reason:
  # workflow_dispatch only exists for workflows already registered on the
  # default branch, and this one is. The file that actually runs is the one on
  # the dispatched ref, so this job works from a feature branch.
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest

    # The ceiling is Settings → Actions → General → Workflow permissions; a job
    # cannot ask for more than the repository allows.
    permissions:
      contents: write

    env:
      TAG: v0.1.1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetTrans-win-x64
          path: NetTrans

      - name: Zip it
        run: |
          zip -qr "NetTrans-$TAG-win-x64.zip" NetTrans
          ls -lh "NetTrans-$TAG-win-x64.zip"

      - name: Publish the release
        run: |
          notes=$(cat <<'TEXT'
          解压即用的 Windows 绿色版（x64，自包含，不装、不写注册表）。

          - 下载管理：HTTP/FTP 分段续传、HLS/DASH、BitTorrent
          - 完成后校验 + 哈希库 + 联网核对发布方的 SHA256SUMS
          - 大文件核对：本机 1 GB 以上单体文件，单独的账本
          - 深度整理：先按项目、再按类型，一张卡一张卡地问，随时整批还原

          命令行：`--tidy 目录 --ask`、`--tidy --undo`、`--bigfiles`
          TEXT
          )

          gh release create "$TAG" "NetTrans-$TAG-win-x64.zip" \
            --target "${{ github.sha }}" \
            --title "NetTrans $TAG" \
            --notes "$notes"

          gh release view "$TAG" --json url --jq .url
